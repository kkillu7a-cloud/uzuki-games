<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>الثعبان 🐍</title>
<style>
:root{--bg:#0b1410;--card:#13241b;--g1:#3ddc84;--g2:#1fa35c;--red:#ff4d4f;--tx:#e8fff2;--mut:#7fae95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none;touch-action:none}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 8px;font-weight:700}
header b{color:var(--g1);font-size:1.25rem}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-size:.95rem}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#c{background:#0f1c15;border-radius:14px;box-shadow:0 0 0 2px #1d3a2b,0 10px 30px #0008}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0b1410d9;border-radius:14px;text-align:center;font-size:1.1rem;cursor:pointer;margin:auto}
#ov h2{margin:0;font-size:1.8rem;color:var(--g1)}
#ov p{margin:0;color:var(--mut)}
#ov button{margin-top:6px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#04140b;font-weight:800;font-size:1.05rem;padding:12px 34px}
#pad{direction:ltr;display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;padding:10px 0 14px}
#pad button{border:0;border-radius:16px;background:var(--card);color:var(--g1);font-size:1.6rem}
#pad button:active{background:#1d3a2b}
#u{grid-column:2;grid-row:1}#l{grid-column:1;grid-row:2}#d{grid-column:2;grid-row:2}#r{grid-column:3;grid-row:2}
</style>
</head>
<body>
<header><b>🐍 الثعبان</b><span class="pill">النقاط: <span id="sc">0</span></span><span class="pill">الأعلى: <span id="bs">0</span></span></header>
<div id="wrap"><canvas id="c"></canvas>
<div id="ov"><h2>🐍 الثعبان</h2><p>اسحب على اللوحة أو استخدم الأسهم</p><button>ابدأ اللعب</button></div></div>
<div id="pad"><button id="u">▲</button><button id="l">◀</button><button id="d">▼</button><button id="r">▶</button></div>
<script>
(()=>{
const N=20,cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const $sc=document.getElementById('sc'),$bs=document.getElementById('bs');
let cell=16,snake=[],dir={x:1,y:0},nextDir=dir,apple={x:0,y:0},score=0,best=0,speed=140,timer=0,state='idle';
try{best=+localStorage.getItem('snk_best')||0}catch(e){}
$bs.textContent=best;
const rnd=n=>Math.floor(Math.random()*n);
function fit(){
  const w=cv.parentElement,s=Math.min(w.clientWidth,w.clientHeight),dpr=window.devicePixelRatio||1;
  cell=Math.max(8,Math.floor(s/N));const px=cell*N;
  cv.style.width=cv.style.height=px+'px';cv.width=cv.height=Math.round(px*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ov.style.width=cv.style.width;ov.style.height=cv.style.height;draw();
}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nextDir={x:1,y:0};score=0;speed=140;
  placeApple();$sc.textContent=0;
}
function placeApple(){
  if(snake.length>=N*N)return;
  let p;do{p={x:rnd(N),y:rnd(N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));apple=p;
}
function loop(){
  if(state!=='run')return;
  step();
  if(state==='run')timer=setTimeout(loop,speed);
}
function step(){
  dir=nextDir;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  const eat=h.x===apple.x&&h.y===apple.y;
  const body=eat?snake:snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(s=>s.x===h.x&&s.y===h.y))return over();
  snake.unshift(h);
  if(eat){
    score++;$sc.textContent=score;
    if(score%4===0)speed=Math.max(70,speed-10);
    if(snake.length>=N*N)return over(true);
    placeApple();
    try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  }else snake.pop();
  draw();
}
function over(win){
  state='over';clearTimeout(timer);
  if(score>best){best=score;$bs.textContent=best;try{localStorage.setItem('snk_best',best)}catch(e){}}
  draw();
  ov.innerHTML='<h2>'+(win?'🏆 فزت!':'💥 خسرت')+'</h2><p>نقاطك: '+score+' — الأعلى: '+best+'</p><button>العب من جديد</button>';
  ov.style.display='flex';
}
function start(){
  if(state==='run')return;
  if(state==='pause'){state='run';ov.style.display='none';timer=setTimeout(loop,speed);return}
  reset();state='run';ov.style.display='none';draw();timer=setTimeout(loop,speed);
}
function setDir(dx,dy){
  if(state==='idle'||state==='over'||state==='pause'){start();}
  if(dx===-dir.x&&dy===-dir.y)return;
  nextDir={x:dx,y:dy};
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}
function draw(){
  const S=cell*N;ctx.clearRect(0,0,S,S);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=(x+y)%2?'#0f1c15':'#112119';ctx.fillRect(x*cell,y*cell,cell,cell)}
  if(!snake.length)return;
  ctx.shadowColor='#ff4d4f';ctx.shadowBlur=cell*.8;ctx.fillStyle='#ff4d4f';
  ctx.beginPath();ctx.arc((apple.x+.5)*cell,(apple.y+.5)*cell,cell*.38,0,7);ctx.fill();ctx.shadowBlur=0;
  snake.forEach((s,i)=>{
    const t=1-i/Math.max(snake.length,1)*.45;
    ctx.fillStyle=i?`rgb(${Math.round(31*t)},${Math.round(190*t)},${Math.round(100*t)})`:'#5dffa0';
    rr(s.x*cell+1,s.y*cell+1,cell-2,cell-2,cell*.3);
  });
  const h=snake[0],ex=dir.x?(dir.x>0?.62:.38):.3,ey=dir.y?(dir.y>0?.62:.38):.3;
  ctx.fillStyle='#04140b';
  [[ex,dir.x?.3:ey],[dir.x?ex:.7,dir.x?.7:ey]].forEach(([a,b])=>{ctx.beginPath();ctx.arc((h.x+a)*cell,(h.y+b)*cell,cell*.08,0,7);ctx.fill()});
}
// أزرار
const bind=(id,dx,dy)=>document.getElementById(id).addEventListener('touchstart',e=>{e.preventDefault();setDir(dx,dy)},{passive:false});
bind('u',0,-1);bind('d',0,1);bind('l',-1,0);bind('r',1,0);
[['u',0,-1],['d',0,1],['l',-1,0],['r',1,0]].forEach(([id,dx,dy])=>document.getElementById(id).addEventListener('click',()=>setDir(dx,dy)));
// سحب
let sx=0,sy=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
document.addEventListener('touchmove',e=>{
  e.preventDefault();const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
  sx=t.clientX;sy=t.clientY;
},{passive:false});
// كيبورد
addEventListener('keydown',e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){e.preventDefault();setDir(m[0],m[1])}
});
ov.addEventListener('click',start);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run'){state='pause';clearTimeout(timer);ov.innerHTML='<h2>⏸ إيقاف مؤقت</h2><p>اضغط للمتابعة</p><button>كمّل</button>';ov.style.display='flex'}});
addEventListener('resize',fit);
reset();fit();
})();
</script>
</body>
</html>
